<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haptic Blind Test</title><link rel="icon" href="data:,">
<style>
 :root{color-scheme:dark} body{margin:0;background:#15181d;color:#dde;font:15px system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px}
 h1{font-size:20px} section{background:#1d2128;border-radius:8px;padding:12px 14px;margin:12px 0}
 button{padding:8px 14px;background:#2b6cb0;color:#fff;border:0;border-radius:4px;cursor:pointer;margin:3px} button:disabled{opacity:.4;cursor:default}
 button.ans{background:#4a5568;min-width:90px} input[type=text],input[type=number]{background:#12151a;color:#dde;border:1px solid #333;border-radius:4px;padding:5px;width:90px}
 table{border-collapse:collapse} td,th{border:1px solid #333;padding:4px 10px;text-align:center} .warn{color:#f6ad55} .big{font-size:18px}
</style></head><body>
<h1>触觉盲测：能不能分辨材质？</h1>
<section class="warn">⚠ 安全：先把总音量保持很低；执行器发烫、发出异响或不适就立刻拔线。第一次先点“测试碰撞”，再慢慢加音量。</section>
<section>
 <button id="start">① 启动输出</button> 总音量 <input id="level" type="range" min="0" max="0.5" step="0.01" value="0.1"> <span id="lv">0.10</span>
 <button id="ping">测试碰撞</button> <span id="msg"></span>
</section>
<section id="setup">
 受试者编号 <input id="pid" type="text" value="P1"> 每种材质重复 <input id="reps" type="number" value="5" min="1" max="20" style="width:60px"> 次
 <div id="mats" style="margin:8px 0"></div>
 <button id="begin" disabled>② 开始盲测</button>
 <div>要求：<b>闭眼或遮住屏幕上的提示</b>，只靠触觉判断；每个刺激可重播 1 次。</div>
</section>
<section id="run" hidden>
 <div class="big">第 <span id="no">0</span> / <span id="total">0</span> 题</div>
 <button id="play">▶ 播放</button> <button id="replay" disabled>↻ 重播(仅 1 次)</button>
 <div id="answers" style="margin-top:8px"></div>
</section>
<section id="res" hidden>
 <div class="big" id="sum"></div><div id="conf"></div>
 <button id="dl">下载 JSON</button>
 <div id="verdict"></div>
</section>
<script type="module" src="src/testpage.js"></script>
</body></html>

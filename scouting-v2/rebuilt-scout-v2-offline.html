<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Earthquakers Scout</title>
  <meta name="theme-color" content="#17151a">
  <style>
/* Earthquakers Scout.
   Layout: a basalt brand band with a live seismograph trace on top, then one form page at a time
   on warm stone, each page marked by a phase stripe; magma orange is the single loud color. */
:root {
  color-scheme: light;
  --bg: #f2efea;
  --surface: #fffdfa;
  --surface-2: #ebe6df;
  --ink: #17141a;
  --ink-2: #5b544e;
  --line: #dcd4ca;
  --accent: #c2410c;          /* magma: buttons, selected options */
  --accent-ink: #ffffff;
  --accent-soft: #fbe3d6;
  --band: #17151a;            /* basalt brand band, same in both themes */
  --band-ink: #f4eee8;
  --band-ink-2: #a79f98;
  --band-line: #2c2830;
  --trace: #ff6b2c;
  --danger: #b42318;
  --ok: #18794e;
  --red: #c8322f;
  --blue: #2563c9;
  --ph-prematch: #6b625a;
  --ph-auto: #b45309;
  --ph-teleop: #18794e;
  --ph-endgame: #6d4bb8;
  --ph-postmatch: #2f6596;
  --ph-pit: #a1441f;
  --ph-qr: #c2410c;
  --zone-us: #e9e2d8;
  --zone-red: #f6dcd8;
  --zone-blue: #dce6f5;
  --zone-mid: #efebe5;
  --wall: #8a817a;
  --fixture: #cfc6bb;
  --hub: #f2b84b;
  --bump: #bdb4aa;
  --trench: #a9b7c6;
  --s1: #2a78d6;
  --s2: #eb6834;
  --radius: 14px;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0e11;
    --surface: #1a181d;
    --surface-2: #26232a;
    --ink: #f3eee9;
    --ink-2: #b0a79f;
    --line: #35303a;
    --accent: #ff6b2c;
    --accent-ink: #1a0d06;
    --accent-soft: #3a1d10;
    --band: #0b0a0d;
    --band-line: #25212a;
    --danger: #f2554a;
    --ok: #3fbf7a;
    --red: #f06a66;
    --blue: #6aa2f2;
    --ph-prematch: #a39a91;
    --ph-auto: #f0a33a;
    --ph-teleop: #3fbf7a;
    --ph-endgame: #a58ae8;
    --ph-postmatch: #6aa6dc;
    --ph-pit: #e2875f;
    --ph-qr: #ff6b2c;
    --zone-us: #2a2620;
    --zone-red: #45201f;
    --zone-blue: #1c2c45;
    --zone-mid: #1f1d22;
    --wall: #5f5750;
    --fixture: #3d3832;
    --hub: #b88a2a;
    --bump: #403a35;
    --trench: #34495e;
    --s1: #3987e5;
    --s2: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0e11;
  --surface: #1a181d;
  --surface-2: #26232a;
  --ink: #f3eee9;
  --ink-2: #b0a79f;
  --line: #35303a;
  --accent: #ff6b2c;
  --accent-ink: #1a0d06;
  --accent-soft: #3a1d10;
  --band: #0b0a0d;
  --band-line: #25212a;
  --danger: #f2554a;
  --ok: #3fbf7a;
  --red: #f06a66;
  --blue: #6aa2f2;
  --ph-prematch: #a39a91;
  --ph-auto: #f0a33a;
  --ph-teleop: #3fbf7a;
  --ph-endgame: #a58ae8;
  --ph-postmatch: #6aa6dc;
  --ph-pit: #e2875f;
  --ph-qr: #ff6b2c;
  --zone-us: #2a2620;
  --zone-red: #45201f;
  --zone-blue: #1c2c45;
  --zone-mid: #1f1d22;
  --wall: #5f5750;
  --fixture: #3d3832;
  --hub: #b88a2a;
  --bump: #403a35;
  --trench: #34495e;
  --s1: #3987e5;
  --s2: #d95926;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--font);
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
h2 { margin: 0; font: 900 1.9rem/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
h3 { margin: 0; font: 700 1.25rem/1.1 var(--font-display); letter-spacing: .03em; text-transform: uppercase; }
h4 { margin: 12px 0 6px; font-size: .95rem; }
.muted { color: var(--ink-2); }
.small, small { font-size: .82rem; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Brand band ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--band); color: var(--band-ink);
  padding-top: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--band-line);
}
.brandrow { display: flex; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto; }
.mark { width: 38px; height: 38px; display: block; flex: none; }
.teamlogo { width: 46px; height: 46px; display: block; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px var(--band-line); }
.mark-tile { fill: #26222b; }
.mark-wave { fill: none; stroke: var(--trace); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.mark-fault { fill: none; stroke: var(--band-ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wordmark { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.teamname { font: 900 1.55rem/0.95 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.sub { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--band-ink-2); margin-top: 3px; }
.eventchip {
  font: 600 .78rem var(--font-num); letter-spacing: .06em; color: var(--band-ink);
  border: 1px solid var(--band-line); background: #221f26; border-radius: 999px; padding: 4px 10px; white-space: nowrap;
}
#quake { max-width: 760px; margin: 6px auto 0; }
.quake { display: block; width: 100%; height: 28px; }
.quake-base { stroke: var(--band-line); stroke-width: 1; }
.quake-line { fill: none; stroke: var(--trace); stroke-width: 1.6; stroke-linejoin: round; opacity: .85; transition: opacity .3s; }
.quake-line.hit { opacity: 1; stroke-width: 2; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 760px; margin: 0 auto; scrollbar-width: none; }
.tabs a {
  padding: 10px 14px 9px; color: var(--band-ink-2); text-decoration: none; white-space: nowrap;
  font: 700 1rem var(--font-display); letter-spacing: .08em; text-transform: uppercase;
  border-bottom: 3px solid transparent;
}
.tabs a.on { color: var(--band-ink); border-color: var(--trace); }

main {
  max-width: 760px; margin: 0 auto; padding-block: 18px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Steps: ticks on a seismograph baseline ---------- */
.steps { list-style: none; display: flex; padding: 0; margin: 0 0 14px; position: relative; }
.steps::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--line); }
.steps li { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.steps i { width: 2px; height: 16px; background: var(--line); display: block; position: relative; }
.steps li.done i { background: var(--ink-2); }
.steps li.on i { width: 4px; height: 16px; background: var(--accent); box-shadow: 0 -6px 0 -1px var(--accent), 0 6px 0 -1px var(--accent); }
.steps span { font: 700 .72rem var(--font-num); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.steps li.on span { color: var(--ink); }

/* ---------- Form page ---------- */
.page {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden;
}
.page::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--ph, var(--line)); }
.ph-prematch { --ph: var(--ph-prematch); }
.ph-auto { --ph: var(--ph-auto); }
.ph-teleop { --ph: var(--ph-teleop); }
.ph-endgame { --ph: var(--ph-endgame); }
.ph-postmatch { --ph: var(--ph-postmatch); }
.ph-pit { --ph: var(--ph-pit); }
.ph-qr { --ph: var(--ph-qr); }
.page h2 { color: var(--ph); }
.item { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.iname { font: 700 .8rem var(--font-num); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.req { color: var(--accent); }
.eventline { margin: -6px 0 0; color: var(--ink-2); font-size: .9rem; }
.eventline b { color: var(--ink); font-family: var(--font-num); letter-spacing: .04em; }

input, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 12px; width: 100%;
}
input:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox] { width: auto; accent-color: var(--accent); }
textarea { resize: vertical; }

.btn {
  font: 600 1rem var(--font); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 10px; padding: 10px 16px; cursor: pointer; touch-action: manipulation;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.small { padding: 6px 10px; font-size: .85rem; }
.btn.running { background: var(--danger); color: #fff; border-color: transparent; }
.link { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--accent); cursor: pointer; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.opt {
  font: 500 1rem var(--font); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; min-width: 48px; touch-action: manipulation;
}
.opt.none { font-size: .9rem; color: var(--ink-2); }
.opt.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.stations { display: grid; grid-template-columns: repeat(3, 1fr); }
.stations .opt.r { border-color: var(--red); color: var(--red); }
.stations .opt.b { border-color: var(--blue); color: var(--blue); }
.stations .opt.r.on { background: var(--red); color: #fff; }
.stations .opt.b.on { background: var(--blue); color: #fff; }
.toggle {
  font: 700 .95rem var(--font); width: 96px; padding: 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); cursor: pointer;
}
.toggle.on { background: var(--ok); border-color: var(--ok); color: #fff; }

.counter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.counter .count {
  min-width: 72px; text-align: center; font: 700 2.1rem/1 var(--font-num); font-variant-numeric: tabular-nums;
  padding: 6px 4px; border-bottom: 2px solid var(--line);
}
.counter .plus { min-width: 58px; padding: 13px 10px; font-family: var(--font-num); font-weight: 700; }
.counter .minus { min-width: 48px; padding: 13px 10px; }

.fieldwrap { display: flex; flex-direction: column; gap: 6px; }
.fieldcanvas { width: 100%; max-width: 100%; display: block; border-radius: 10px; border: 1px solid var(--line); cursor: crosshair; touch-action: manipulation; }

.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
.pager .btn { flex: 1; padding: 15px; font: 700 1.15rem var(--font-display); letter-spacing: .08em; text-transform: uppercase; }

/* ---------- QR / reading ---------- */
.reading { display: flex; flex-direction: column; gap: 6px; background: var(--bg); border-radius: 12px; padding: 12px 14px; }
.readout { display: flex; flex-direction: column; }
.readout small { font: 700 .7rem var(--font-num); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.readout b { font: 900 3rem/1 var(--font-display); color: var(--accent); }
.seismo { width: 100%; height: auto; display: block; max-height: 140px; }
.seismo-line { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; }
.seismo-div { stroke: var(--line); stroke-dasharray: 2 3; }
.seismo-val { fill: var(--ink); font: 700 14px var(--font-num); }
.seismo-label { fill: var(--ink-2); font: 600 10px var(--font-num); letter-spacing: .08em; text-transform: uppercase; }
.qr { background: #fff; padding: 10px; border-radius: 12px; max-width: 420px; width: 100%; margin: 0 auto; border: 1px solid var(--line); }
.qr svg { display: block; width: 100%; height: auto; }
.raw { font: .8rem ui-monospace, Menlo, monospace; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }

/* ---------- Data / settings ---------- */
.datapage > h2, .settings > h2 { margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.check { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font: 700 .72rem var(--font-num); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
th.sort { cursor: pointer; }
th.sort.on { color: var(--accent); }
td.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
tr.sel td { background: var(--accent-soft); }
.barcell { position: relative; min-width: 90px; }
.barcell .bar { position: absolute; left: 8px; top: 50%; height: 8px; margin-top: -4px; max-width: calc(100% - 52px); background: var(--accent); border-radius: 0 4px 4px 0; opacity: .85; }
.barcell .barval { position: relative; font-weight: 700; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
.legend .k-auto { background: var(--s1); }
.legend .k-tele { background: var(--s2); }
dl.pit { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
dl.pit dt { color: var(--ink-2); }
dl.pit dd { margin: 0; }
.notes { margin: 0; padding-left: 18px; }

.modal { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-card { background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 18px; max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.modal-card p { margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--band); color: var(--band-ink); padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px);
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; border-left: 4px solid var(--trace);
}
.toast.show { opacity: 1; }
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--danger); }

@media (max-width: 380px) {
  .teamname { font-size: 1.3rem; }
  .eventchip { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

    <div class="brandrow">
      <span id="mark"></span>
      <div class="wordmark">
        <span class="teamname" id="teamname">Earthquakers</span>
        <span class="sub" id="teamsub">FRC 9094 · REBUILT Scout</span>
      </div>
      <span class="eventchip" id="eventchip"></span>
    </div>
    <div id="quake"></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="app"></main>

    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }

      return data;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          for (var i = 0; i < rsBlocks.length; i++) {

      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

      qrSvg += '<path d="';

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;

      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {

        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }

      return escaped;

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {

        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

        ascii += '\n';

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');

      return ascii.substring(0, ascii.length-1);

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  qrcode.stringToBytesFuncs = {

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

        h('div', { class: 'row' },

  <script>
// Data lead page: import scanned rows, team table, shooting heat map, CSV/TSV export.
var V2 = (globalThis.V2 = globalThis.V2 || {});

(function () {
  var h;
  var sortKey = 'points', heatTeam = null;

  function records() {
    var all = V2.ui.get('records', {});
    return Object.keys(all).map(function (k) { return all[k]; });
  }

  function importText(text) {
    var all = V2.ui.get('records', {});
    var added = 0, same = 0, bad = 0;
    String(text).split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var d = V2.codec.decode(line);
      if (!d) return bad++;
      var k = V2.codec.key(d.kind, d.values);
      if (all[k]) same++;
      else added++;
      all[k] = { kind: d.kind, values: d.values, ts: Date.now() };
    });
    V2.ui.set('records', all);
    V2.ui.toast(added + ' added, ' + same + ' already had' + (bad ? ', ' + bad + ' not recognized' : ''), bad ? 'err' : 'ok');
  }

  function rowsOf(kind, ev) {
    return records().filter(function (r) { return r.kind === kind && (!ev || r.values.e === ev); }).map(function (r) { return r.values; });
  }

  function tsv(kind, ev) {
    return [V2.codec.header(kind)].concat(rowsOf(kind, ev).map(function (v) { return V2.codec.encode(kind, v); })).join('\n');
  }

  function render(root) {
    h = V2.ui.h;
    var ev = V2.CONFIG.event;
    var rows = rowsOf('match', ev);
    var pits = rowsOf('pit', ev);
    var stats = V2.stats.teams(rows).sort(function (a, b) {
      var x = a[sortKey], y = b[sortKey];
      return sortKey === 't' ? x - y : (y == null ? -1 : y) - (x == null ? -1 : x);
    });
    var redraw = function () { root.textContent = ''; render(root); };

    var paste = h('textarea', { id: 'paste', rows: 4, placeholder: 'Click here, then scan QR codes with a USB scanner. Or paste rows (one per line).' });
    paste.addEventListener('keydown', function (e) {
      // Most USB scanners end each code with Enter: import as soon as a full row arrives
      if (e.key === 'Enter' && !e.shiftKey && paste.value.trim()) {
        e.preventDefault();
        importText(paste.value);
        paste.value = '';
        redraw();
        setTimeout(function () { var p = document.getElementById('paste'); if (p) p.focus(); }, 0);
      }
    });

    var COLS = [
      ['t', 'Team'], ['n', 'M'], ['points', 'Avg pts'], ['best', 'Best'], ['autoFuel', 'Auto Fuel'], ['teleFuel', 'Tele Fuel'], ['endFuel', 'End Fuel'],
      ['ferried', 'Ferried'], ['accuracy', 'Acc %'], ['climbPts', 'Climb pts'], ['autoL1', 'Auto L1 %'], ['incap', 'Incap s'],
      ['defense', 'Def. s'], ['defRating', 'Def. rating'], ['driver', 'Driver'], ['problems', 'Issues'],
    ];

    var topPts = Math.max.apply(null, stats.map(function (s) { return s.points; }).concat([1]));
    var table = stats.length ? h('div', { class: 'scroll' }, h('table', { class: 'data' },
      h('thead', null, h('tr', null, COLS.map(function (c) {
        return h('th', { class: 'sort' + (sortKey === c[0] ? ' on' : ''), onclick: function () { sortKey = c[0]; redraw(); } }, c[1]);
      }))),
      h('tbody', null, stats.map(function (s) {
        return h('tr', { class: heatTeam === s.t ? 'sel' : '' }, COLS.map(function (c) {
          if (c[0] === 't') return h('td', null, h('button', { type: 'button', class: 'link', onclick: function () { heatTeam = s.t; redraw(); } }, s.t));
          var v = s[c[0]];
          if (c[0] === 'points') {
            // Bar length = share of the event's best average, so strong teams stand out at a glance
            return h('td', { class: 'num barcell' }, h('span', { class: 'bar', style: 'width:' + Math.round((v / topPts) * 100) + '%' }), h('span', { class: 'barval' }, v));
          }
          return h('td', { class: 'num' }, v == null ? '–' : v);
        }));
      }))
    )) : h('p', { class: 'muted' }, 'No match data for ' + ev + ' yet. Scan or paste rows above.');

    var detail = null;
    var t = stats.filter(function (s) { return s.t === heatTeam; })[0];
    if (t) {
      var mine = rows.filter(function (v) { return v.t === t.t; });
      var auto = [], tele = [];
      mine.forEach(function (v) { auto = auto.concat(v.as || []); tele = tele.concat(v.ts || []); });
      var pit = pits.filter(function (v) { return v.t === t.t; })[0];
      detail = h('section', { class: 'card' },
        h('h3', null, 'Team ' + t.t),
        h('p', { class: 'muted' }, t.n + ' matches · climbs L1/L2/L3: ' + t.levels.L1 + '/' + t.levels.L2 + '/' + t.levels.L3 + ' · no-shows ' + t.noShow +
          ' · played defense in ' + t.playedDefense + ' · was defended in ' + t.wasDefended + (t.defendedRating != null ? ' (handled it ' + t.defendedRating + '/5)' : '')),
        h('div', { class: 'legend' }, h('span', null, h('i', { class: 'k-auto' }), 'Auto shots (' + auto.length + ')'), h('span', null, h('i', { class: 'k-tele' }), 'Teleop shots (' + tele.length + ')')),
        h('small', { class: 'muted' }, 'Drawn from the robot\'s own alliance end, with its own wall on the left.'),
        V2.field.heat([{ points: auto, color: V2.field.css('--s1') }, { points: tele, color: V2.field.css('--s2') }]),
        pit ? h('div', null, h('h4', null, 'Pit'), h('dl', { class: 'pit' }, V2.codec.fields('pit').filter(function (f) { return ['s', 'e', 't'].indexOf(f.code) < 0; }).map(function (f) {
          var v = pit[f.code];
          if (v == null || v === '' || (Array.isArray(v) && !v.length)) return null;
          var shown = f.choices ? (Array.isArray(v) ? v : [v]).map(function (k) { return f.choices[k] || k; }).join(', ') : v === true ? 'Yes' : v === false ? 'No' : v;
          return [h('dt', null, f.name), h('dd', null, String(shown))];
        }))) : null,
        t.comments.length ? h('div', null, h('h4', null, 'Comments'), h('ul', { class: 'notes' }, t.comments.map(function (c) { return h('li', null, h('b', null, 'Q' + c.m + ' '), c.text, h('small', { class: 'muted' }, ' — ' + c.s)); }))) : null
      );
    }

    var out = h('textarea', { class: 'raw', rows: 4, readonly: true, 'aria-label': 'Export' });
    root.appendChild(h('div', { class: 'datapage' },
      h('h2', null, 'Data · ' + ev),
      h('section', { class: 'card' }, h('h3', null, 'Import'), paste,
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary', onclick: function () { importText(paste.value); paste.value = ''; redraw(); } }, 'Import'),
          h('small', { class: 'muted' }, records().length + ' records on this device'))),
      h('section', { class: 'card' }, h('h3', null, 'Teams'), h('p', { class: 'muted' }, 'Tap a team number for its shooting map, pit info and comments.'), table),
      detail,
      h('section', { class: 'card' }, h('h3', null, 'Export'),
        h('p', { class: 'muted' }, 'Tab-separated with a header row. Paste into Google Sheets or Excel.'),
        h('div', { class: 'row wrap' },
          h('button', { type: 'button', class: 'btn', onclick: function () { out.value = tsv('match', ev); out.select(); V2.ui.copy(out.value); } }, 'Copy match data'),
          h('button', { type: 'button', class: 'btn', onclick: function () { out.value = tsv('pit', ev); out.select(); V2.ui.copy(out.value); } }, 'Copy pit data'),
          h('button', { type: 'button', class: 'btn danger', onclick: function () {
            V2.ui.ask('Delete all records on this device? Copy the data out first.', 'Delete all').then(function (ok) {
              if (!ok) return;
              V2.ui.set('records', {});
              redraw();
            });
          } }, 'Delete all')),
        out)
    ));
  }

  V2.data = { render: render, importText: importText };
})();

</script>
  <script>
// Tabs + settings page.
var V2 = (globalThis.V2 = globalThis.V2 || {});

(function () {
  var h = V2.ui.h;
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

  var TABS = { scout: 'Match', pit: 'Pit', data: 'Data', settings: 'Settings' };

  function settingsPage(root) {
    var s = V2.ui.get('settings', {});
    function save() { V2.ui.set('settings', s); }
    var csv = h('textarea', { id: 'sched', rows: 4, placeholder: 'match,R1,R2,R3,B1,B2,B3\n1,254,1678,971,118,148,2056' });
    var ev = V2.CONFIG.event;
    var sch = (V2.ui.get('schedule', {})[ev] || []).length;
    root.appendChild(h('div', { class: 'settings' },
      h('h2', null, 'Settings'),
      h('section', { class: 'card' },
        h('p', { class: 'eventline' }, 'Event: ', h('b', null, V2.CONFIG.event)),
        h('small', { class: 'muted' }, 'Set by the scouting lead for every scout. To change it, edit event in js/config.js and update the app.'),
        h('label', { class: 'check' }, h('input', { type: 'checkbox', id: 'set-flip', checked: !!s.flip, onchange: function (e) { s.flip = e.target.checked; save(); } }),
          ' Flip the field map (our alliance on the right, as seen from your seat)')),
      h('section', { class: 'card' },
        h('h3', null, 'Match schedule'),
        h('p', { class: 'muted' }, sch ? sch + ' matches loaded for ' + ev + '. Team numbers fill in from the station.' : 'Paste the schedule so team numbers fill in automatically.'),
        csv,
        h('button', { type: 'button', class: 'btn', onclick: function () {
          var rows = [];
          csv.value.split(/\r?\n/).forEach(function (l) {
            var c = l.split(/[,\t;]/).map(function (x) { return x.trim(); });
            if (c.length < 7 || !/^\d+$/.test(c[0])) return;
            rows.push({ m: Number(c[0]), R1: +c[1], R2: +c[2], R3: +c[3], B1: +c[4], B2: +c[5], B3: +c[6] });
          });
          if (!rows.length) return V2.ui.toast('No matches found. Format: match,R1,R2,R3,B1,B2,B3', 'err');
          var all = V2.ui.get('schedule', {});
          all[ev] = rows;
          V2.ui.set('schedule', all);
          V2.ui.toast(rows.length + ' matches loaded', 'ok');
          root.textContent = '';
          settingsPage(root);
        } }, 'Load schedule')),
      offlineCard(),
      h('p', { class: 'muted small' }, V2.CONFIG.team.name + ' · FRC ' + V2.CONFIG.team.number + ' · REBUILT Scout v2 · fields are defined in js/config.js')
    ));
  }

  var OFFLINE_FILE = 'rebuilt-scout-v2-offline.html';

  // One-file copy of the whole app that runs from the device's storage with no network
  function offlineCard() {
    if (V2.OFFLINE_BUILD) {
      return h('section', { class: 'card' }, h('h3', null, 'Offline copy'),
        h('p', { class: 'muted' }, 'You are using the offline file. It needs no internet. Keep it on this device and open it from the same place each time, so your records stay with it.'));
    }
    var status = h('small', { class: 'muted' });
    var btn = h('button', { type: 'button', class: 'btn primary', onclick: function () {
      status.textContent = 'Preparing…';
      fetch(OFFLINE_FILE).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (html) {
        var viaClaude = globalThis.claude && typeof claude.use === 'function' ? claude.use('downloads') : Promise.resolve(null);
        return viaClaude.then(function (d) {
          if (d) return d.save({ filename: OFFLINE_FILE, data: html }).then(function () { status.textContent = 'Saved.'; });
          var a = h('a', { href: URL.createObjectURL(new Blob([html], { type: 'text/html' })), download: OFFLINE_FILE });
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
          status.textContent = 'Downloaded. Open the file in Chrome or Edge.';
        });
      }).catch(function (e) {
        status.textContent = 'Could not download: ' + e.message;
      });
    } }, 'Download offline file');
    return h('section', { class: 'card' }, h('h3', null, 'Offline copy'),
      h('p', { class: 'muted' }, 'One HTML file with the whole app. Save it to a phone, tablet or laptop and open it in a browser with no internet. ' +
        (navigator.serviceWorker && location.protocol.indexOf('http') === 0 ? 'This page also keeps working offline after you have opened it once.' : '')),

  }

  function route() {
    var tab = location.hash.replace('#', '');

  var T = V2.CONFIG.team;
  document.getElementById('teamname').textContent = T.name;

  document.getElementById('eventchip').textContent = V2.CONFIG.event;
  // Team logo (the offline file carries it inline as V2.LOGO_SRC); fall back to the seismograph mark
  var logoSrc = V2.LOGO_SRC || T.logo;
  if (V2.LOGO_SRC) document.head.appendChild(h('link', { rel: 'icon', href: V2.LOGO_SRC }));
  document.getElementById('mark').appendChild(logoSrc
    ? h('img', { src: logoSrc, alt: T.name + ' logo', class: 'teamlogo', width: 44, height: 44 })

  V2.quake.strip(document.getElementById('quake'));

  var nav = document.getElementById('tabs');
  Object.keys(TABS).forEach(function (k) { nav.appendChild(h('a', { href: '#' + k }, TABS[k])); });

  if (!V2.OFFLINE_BUILD && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* not allowed here: online only */ });
  }
})();
